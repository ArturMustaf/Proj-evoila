spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    generate-ddl: true

    properties:
      hibernate:
        schema_update:
          unique_constraint_strategy: RECREATE_QUIETLY
        search:
          default:
            indexmanager: elasticsearch
            elasticsearch:
              host: http://localhost:9210
              index_schema_management_strategy: drop-and-create
              required_index_status: yellow


cors-url: http://localhost:4200,

keycloak:
  auth-server-url: http://hatkeinehaende.de:9080/auth/
  realm: TH-Bingen
  bearer-only: true
  resource: backendClient
  principal-attribute: preferred_username
  cors: true
