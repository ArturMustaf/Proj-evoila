<div class="vdcs">
  <div class="card">
    <div class="card-header">
      <div class="clr-row">
        <div class="clr-col-3">
          <h4 cds-text="heading medium" style="margin-block-start: 0; margin-block-end: 0"><a routerLink="./" style="color: black">{{vdc.name}}</a></h4>
        </div>
        <div class="clr-col-9">
            <p style="margin-top: 0">
              <clr-icon shape="map-marker"></clr-icon>
              {{vdc.href}}
            </p>
        </div>
      </div>
    </div>

    <div class="card-block">
      <div class="clr-row">
        <div class="clr-col-3">
          <p>
            <span class="RessourceTitle"> vApps  </span>
            <br>
            <span>{{vApps.length}}</span>
          </p>
          <p>
            <span class="RessourceTitle">VMs</span>
            <br>
            <!--Todo change to list number of vms-->
            <span>{{vApps.length}}</span>
          </p>
        </div>
        <div class="clr-col-9">
          <div class="clr-row">
            <div class="clr-col">
              <h5 class="RessourceTitle">CPU</h5>
              <clr-icon shape="cpu" size="36"></clr-icon>
              <p>{{computeCapacity.cpuUsed}}/{{computeCapacity.cpuLimit}} Mhz</p>

            </div>
            <div class="clr-col">
              <h5 class="RessourceTitle">Memory</h5>
              <clr-icon shape="memory" size="36"></clr-icon>
              <p>{{computeCapacity.memoryUsed}}/{{computeCapacity.memoryLimit}}MB</p>
            </div>

            <div class="clr-col">
              <h5 class="RessourceTitle">Storage</h5>
              <clr-icon shape="storage" size="36"></clr-icon>
              <p>{{storageProfile.storageUsedMB}}/{{storageProfile.maxLimit}} MB</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
