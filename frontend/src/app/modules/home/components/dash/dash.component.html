<div class="clr-row" style="height: 100% !important">
  <div class="clr-col-md" style="height: 100%">
    <div class="card clr-row-md item-projects" style="height: 50%; margin-top: 0; overflow: auto">
      <div class="card-header">CF Spaces</div>
      <div class="card-block" style="overflow: auto">
        <app-cf-apps-view [spaceList]="spaceList" [appList1]="appList1" [appList2]="appList2"></app-cf-apps-view>
      </div>
    </div>

    <div class="card clr-row-md item-costs" style="height: 50%; margin-top: 0">
      <div class="card-header">Running costs in €</div>
      <div class="card-block">
        <div *ngIf="isDataReady">
          <app-dash-costs-diagram [data]="costsDataForDiagram"></app-dash-costs-diagram>
        </div>
      </div>
    </div>
  </div>
  <div class="card clr-col-md item-vdcs" style="height: 100%; margin-top: 0; overflow: auto">
    <div class="card-header">VDCs</div>
    <div class="card-block" style="overflow-y: auto">
      <ul>
      <li *ngFor="let vdc of this.vdcList">
        <app-single-vdc [vdc]="vdc"></app-single-vdc>
      </li>
      </ul>
    </div>
  </div>
</div>
