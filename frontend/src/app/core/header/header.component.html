<header class="header-5">
  <div class="branding">
    <a class="nav-link">
      <span class="title" (click)="toStart()">{{headername}}</span>
    </a>
  </div>
  <div class="header-nav" *ngIf="!this.nav.isAdmin">
    <a [class.active]="this.path === '/'" class="nav-link" routerLink="/">Dashboard</a>
    <a [class.active]="this.path === '/costs'" class="nav-link" routerLink="/costs">Kosten</a>
    <a [class.active]="this.path === '/resources'" class="nav-link" routerLink="/resources">Ressourcen</a>
  </div>
  <div class="header-nav" *ngIf="this.nav.isAdmin">
    <a [class.active]="this.path.includes('projects')" class="nav-link" routerLink="/admin/grid/projects">Projekte</a>
    <a [class.active]="this.path.includes('customers')" class="nav-link" routerLink="/admin/grid/customers">Nutzer</a>
    <a [class.active]="this.path.includes('resourceTypes') || this.path.includes('resourcetypes')" class="nav-link"
       routerLink="/admin/grid/resourceTypes">Ressourcen</a>
  </div>

  <div class="header-actions" >
    <a *ngIf="!this.nav.isAdmin" [class.active]="this.path === '/tickets'" class="nav-link" routerLink="/tickets">Tickets</a>
    <app-project-dropdown *ngIf="!this.nav.isAdmin"></app-project-dropdown>
    <clr-dropdown>
      <button clrDropdownTrigger id="usericon">
        <clr-icon shape="user"></clr-icon>
      </button>
      <clr-dropdown-menu clrPosition="bottom-right" *clrIfOpen>
        <div class="dropdown-header">Willkommen {{username}}</div>
        <button type="button" (click)="settings();" clrDropdownItem>
          <clr-icon shape="cog"></clr-icon>
          Einstellungen
        </button>
        <button *ngIf="redirectToAdmin" type="button" (click)="toAdmin();" clrDropdownItem>
          <clr-icon shape="key"></clr-icon>
          Adminportal
        </button>
        <button *ngIf="redirectToAdmin && redirectToUser" type="button" (click)="toDash();" clrDropdownItem>
          <clr-icon shape="pinboard"></clr-icon>
          Dashboard
        </button>
        <button type="button" (click)="logout();" clrDropdownItem>
          <clr-icon shape="logout"></clr-icon>
          Logout
        </button>
      </clr-dropdown-menu>
    </clr-dropdown>
  </div>
</header>
