<div class="modal">
  <div aria-hidden="true" class="modal-dialog modal-xl" role="dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button (click)="onClose()" aria-label="Close" class="close" type="button">
          <clr-icon aria-hidden="true" shape="close"></clr-icon>
        </button>
        <h3 class="modal-title">Link</h3>
      </div>
      <div class="modal-body">
        <app-searchable-grid *ngIf="question.selectAllowed && question.genericLinkTable"
                             [inputGridName]="question.genericLinkTable"></app-searchable-grid>
      </div>
      <div class="modal-footer">
        <button (click)="onClose()" class="btn btn-outline" type="button">Cancel</button>
        <button (click)="onOk()" class="btn btn-primary" type="button">Ok</button>
      </div>
    </div>
  </div>
</div>
<div aria-hidden="true" class="modal-backdrop"></div>
