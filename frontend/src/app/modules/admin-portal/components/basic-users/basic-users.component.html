<clr-datagrid (clrDgRefresh)="refresh($event)" [clrDgLoading]="loading">

  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>Nachname</clr-dg-column>
  <clr-dg-column>Email</clr-dg-column>
  <clr-dg-column>Tickets</clr-dg-column>

  <clr-dg-row *ngFor="let user of users; let i = index">
    <clr-dg-cell>{{user.name}}</clr-dg-cell>
    <clr-dg-cell>{{user.surname}}</clr-dg-cell>
    <clr-dg-cell>{{user.contactInformation.email}}</clr-dg-cell>
    <clr-dg-cell>
      <span [class.label-danger]="randoms[this.page * 10 + i] >= 3"
            [class.label-success]="randoms[this.page * 10 + i] == 0"
            [class.label-warning]="randoms[this.page * 10 + i] < 3 && randoms[this.page * 10 + i]>0"
            class="label">{{randoms[this.page * 10 + i]}}</span>
    </clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer>
    {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
    of {{totalItems}} users
    <clr-dg-pagination #pagination [clrDgPage]="page"
                       [clrDgTotalItems]="totalItems"></clr-dg-pagination>
  </clr-dg-footer>
</clr-datagrid>
