name: Build images
on:
  push:
    branches:
      - master
      - develop
      
jobs:
  backend-build-image:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v2

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        id: extract_branch

      - name: Set env to development
        shell: bash
        run: echo "environment=dev" >> $GITHUB_ENV
        if: env.branch == 'develop'

      - name: Set env to production
        shell: bash
        run: echo "environment=prod" >> $GITHUB_ENV
        if: env.branch == 'master'

      - name: Set up JDK 11.0.5
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.5

      - name: Build backend with maven
        working-directory: ./backend
        run: mvn -B spring-boot:build-image -Dspring-boot.build-image.imageName=backend:$environment -P $environment --file pom.xml
        
  crawler-build-image:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v2

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        id: extract_branch

      - name: Set env to development
        shell: bash
        run: echo "environment=dev" >> $GITHUB_ENV
        if: env.branch == 'develop'

      - name: Set env to production
        shell: bash
        run: echo "environment=prod" >> $GITHUB_ENV
        if: env.branch == 'master'

      - name: Set up JDK 11.0.5
        uses: actions/setup-java@v1
        with:
          java-version: 11.0.5

      - name: Build backend with maven
        working-directory: ./crawler
        run: mvn -B spring-boot:build-image -Dspring-boot.build-image.imageName=crawler:$environment -P $environment --file pom.xml

  frontend-build-image:
    runs-on: [ self-hosted, linux ]
    needs: [backend-build-image]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v2

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        id: extract_branch

      - name: Set env to development
        shell: bash
        run: echo "environment=dev" >> $GITHUB_ENV; echo "environment_long=development" >> $GITHUB_ENV
        if: env.branch == 'develop'

      - name: Set env to production
        shell: bash
        run: echo "environment=prod" >> $GITHUB_ENV; echo "environment_long=production" >> $GITHUB_ENV
        if: env.branch == 'master'

      - name:  install node
        uses: actions/setup-node@v1
        with:
          node-version: '14'

      - name: install modules
        run: npm install

      - name: install angular cli
        run: npm install -g @angular/cli

      - name: ng build production
        run: ng build --configuration $environment_long

      - name: build docker image
        run: docker build -t frontend:$environment .


  run-docker-compose:
    runs-on: [ self-hosted, linux ]
    needs: [backend-build-image, frontend-build-image]
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        id: extract_branch

      - name: Set env to development
        shell: bash
        run: echo "environment=dev" >> $GITHUB_ENV
        if: env.branch == 'develop'

      - name: Set env to production
        shell: bash
        run: echo "environment=prod" >> $GITHUB_ENV
        if: env.branch == 'master'


      - name: run docker-compose
        shell: bash
        run: cd ./docker-compose/$environment && docker-compose up -d
