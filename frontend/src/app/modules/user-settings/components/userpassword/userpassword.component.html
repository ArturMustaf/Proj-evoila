<app-usersettings>
  <div class="card">
    <div class="card-header">
      Passwortverwaltung
    </div>
    <div class="card-block">
      <div class="card-text">
        <div role="tooltip" aria-haspopup="true" class="tooltip tooltip-lg tooltip-top-right" id="tool">
          <button class="btn btn-primary" (click)="onClick()">Passwort ändern</button>
          <span class="tooltip-content">Sie werden zu Keycloak weitergeleitet</span>
        </div>
      </div>
    </div>
  </div>
</app-usersettings>
