<clr-datagrid>
  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>ID</clr-dg-column>
  <clr-dg-column>Apps</clr-dg-column>
  <clr-dg-column>Memory</clr-dg-column>

  <clr-dg-row *ngFor="let space of spaceList">
    <clr-dg-cell>{{space.name}}</clr-dg-cell>
    <clr-dg-cell>{{space.guid}}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer>{{spaceList.length}} spaces</clr-dg-footer>
</clr-datagrid>
